<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Concentric Acoustic Defense Circles -->
  <circle cx="300" cy="300" r="260" stroke="#2563EB" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="4 8" />
  <circle cx="300" cy="300" r="200" stroke="#38BDF8" stroke-opacity="0.06" stroke-width="1.5" />
  <circle cx="300" cy="300" r="140" stroke="#2563EB" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="3 6" />

  <!-- Shield Shape -->
  <path d="M300 80 L460 140 C460 320 300 480 300 480 C300 480 140 320 140 140 Z" fill="url(#shieldGrad)" stroke="#2563EB" stroke-opacity="0.1" stroke-width="2" />

  <!-- Internal Audio Soundwave in Shield -->
  <path d="M220 280 Q 260 220, 300 280 T 380 280" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M240 310 Q 270 260, 300 310 T 360 310" stroke="#2563EB" stroke-opacity="0.15" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M260 340 Q 280 300, 300 340 T 340 340" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Center Core Node -->
  <circle cx="300" cy="280" r="6" fill="#2563EB" fill-opacity="0.2" />
  <circle cx="300" cy="280" r="2.5" fill="#38BDF8" fill-opacity="0.4" />
</svg>
